name: Backend check and package

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'js/**'
      - 'tests/**'
      - '*.html'
      - 'css/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/**'

  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'js/**'
      - 'tests/**'
      - '*.html'
      - 'css/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Syntax check
        run: |
          node --check index.js
          node --check app.js
          node --check admin-billing.js
          node --check admin-receipt.js
          node --check billing-payments.js
          node --check payment-router.js
          node --check yookassa.js
          node --check renewals.js
          node --check precharge-notifications.js
          node --check precharge-test.js
          node --check receipt-mail.js
          node --check ydb.js
          node --check ydb-core.js
          node --check security.js
          node --check mail.js
          node --check oauth.js
      - name: Package Cloud Function
        run: zip -j ../qpokoy-backend.zip index.js app.js admin-billing.js admin-receipt.js billing-payments.js payment-router.js yookassa.js renewals.js precharge-notifications.js precharge-test.js receipt-mail.js ydb.js ydb-core.js security.js mail.js oauth.js package.json package-lock.json
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: qpokoy-backend
          path: qpokoy-backend.zip
          if-no-files-found: error

  frontend-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test dependency manager
        uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - name: Install test-only dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Frontend API and DOM regression tests
        run: node --test tests/*.test.js
      - name: All frontend syntax and HTML/CSS structure
        run: node tests/helpers/check-project.js
