name: Backend check and package

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-build.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Syntax check
        run: |
          node --check index.js
          node --check app.js
          node --check ydb.js
          node --check security.js
          node --check mail.js
      - name: Package Cloud Function
        run: zip -j ../qpokoy-backend.zip index.js app.js ydb.js security.js mail.js package.json package-lock.json
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: qpokoy-backend
          path: qpokoy-backend.zip
          if-no-files-found: error
