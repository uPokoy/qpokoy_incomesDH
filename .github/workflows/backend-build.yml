name: Backend check and package

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'js/api-client.js'
      - 'js/auth.js'
      - 'index.html'
      - 'tests/api-client.test.js'
      - '.github/workflows/backend-build.yml'

  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'js/**'
      - 'tests/**'
      - 'admin.html'
      - 'css/admin.css'
      - '.github/workflows/backend-build.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Syntax check
        run: |
          node --check index.js
          node --check app.js
          node --check admin-billing.js
          node --check billing-payments.js
          node --check payment-router.js
          node --check yookassa.js
          node --check renewals.js
          node --check ydb.js
          node --check security.js
          node --check mail.js
          node --check oauth.js
      - name: Package Cloud Function
        run: zip -j ../qpokoy-backend.zip index.js app.js admin-billing.js billing-payments.js payment-router.js yookassa.js renewals.js ydb.js security.js mail.js oauth.js package.json package-lock.json
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: qpokoy-backend
          path: qpokoy-backend.zip
          if-no-files-found: error

  frontend-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: API client tests
        run: node --test tests/*.test.js
      - name: Syntax check
        run: |
          node --check js/admin.js
          node --check js/api-client.js
          node --check js/auth.js
