name: qPokoy cachebust once

on:
  push:
    paths:
      - '.github/workflows/qpokoy-cachebust-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add app-shell cache buster
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '<script id="qPokoyCenteredAppShellFinalJS" src="js/app-shell.js"></script>'
          new = '<script id="qPokoyCenteredAppShellFinalJS" src="js/app-shell.js?v=dev-2026.09.15.06"></script>'
          if old not in text:
              raise SystemExit('Expected app-shell script tag not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit cache buster
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Cache-bust mobile navigation script'
          git push
