name: Apply mobile layout fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: "!contains(github.event.head_commit.message, 'Apply mobile layout fix')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="qPokoyMobileFixV1"' in s:
              raise SystemExit(0)
          css = r'''<style id="qPokoyMobileFixV1">
@media (max-width:430px) {
  html, body { min-width:0; max-width:100%; overflow-x:hidden; }
  body { padding-bottom: env(safe-area-inset-bottom); }
  .content { min-height:100vh; padding-bottom:calc(76px + env(safe-area-inset-bottom)); }
  header { height:56px; padding:0 14px; }
  header h1 { font-size:18px; }
  main { width:100%; max-width:100%; padding:14px 12px 24px; }
  .sidebar { height:64px; padding-bottom:env(safe-area-inset-bottom); grid-template-columns:repeat(3,minmax(0,1fr)); }
  .nav-item { gap:4px; padding:7px 4px; flex-direction:column; }
  .nav-label { max-width:100%; font-size:11px; }
  .nav-icon svg { width:20px; height:20px; }
  .income-top { grid-template-columns:minmax(0,1fr); gap:14px; min-height:0; margin-bottom:14px; padding:16px; border-radius:16px; }
  .income-total { font-size:32px; }
  .income-month-chart { min-height:118px; padding-top:32px; }
  .income-chart-wrap { height:96px; }
  .income-analytics { margin-bottom:14px; padding:14px; border-radius:16px; }
  .analytics-head { align-items:flex-start; flex-direction:column; gap:6px; }
  .analytics-head h2 { font-size:18px; }
  .analytics-total { font-size:18px; }
  .analytics-cards { grid-template-columns:1fr; }
  .analytics-grid { grid-template-columns:1fr; }
  .analytics-category-row { grid-template-columns:minmax(70px,1fr) minmax(50px,1fr) auto; }
  .analytics-category-value { min-width:62px; }
  .income-form { margin-bottom:14px; padding:16px 16px 72px; border-radius:16px; }
  .form-title { margin-right:0; font-size:17px; }
  .form-grid { grid-template-columns:1fr; gap:12px; }
  .save-btn { right:16px; bottom:16px; width:calc(100% - 32px); min-width:0; }
  .calendar-popup { width:min(320px,calc(100vw - 28px)); }
  .income-table-section, .income-list { width:100%; max-width:100%; overflow:hidden; }
  .income-row { grid-template-columns:minmax(0,1fr) auto; gap:8px; }
  .income-row .description { grid-column:1 / -1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .settings-grid, .settings-section, .account-card, .qp-account-card { width:100%; max-width:100%; min-width:0; }
  .settings-card { width:100%; min-width:0; }
  .color-controls, .color-options { max-width:100%; overflow-x:auto; }
  .theme-options { grid-template-columns:1fr; }
  .qp-account-row { grid-template-columns:minmax(0,1fr); }
  .account-actions, .logout-btn { width:100%; }
  .auth-gate, .auth-card { width:100%; max-width:100%; min-width:0; }
  input, select, .category-select, button { max-width:100%; }
}
@media (max-width:360px) {
  main { padding-left:10px; padding-right:10px; }
  .income-top, .income-analytics, .income-form { padding-left:12px; padding-right:12px; }
  .income-total { font-size:29px; }
  .nav-label { font-size:10px; }
  .analytics-card, .analytics-panel { padding:11px; }
}
</style>'''
          marker = '</head>'
          if marker not in s:
              raise SystemExit('head marker not found')
          s = s.replace(marker, css + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched site
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Apply mobile layout fix'
          git push
