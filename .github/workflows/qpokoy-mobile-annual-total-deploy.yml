name: qPokoy mobile annual total deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/qpokoy-mobile-annual-total-deploy.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified mobile annual total fix
        shell: bash
        run: |
          set -euo pipefail

          CURRENT="$(sha256sum index.html | awk '{print $1}')"
          EXPECTED_BASE="94316b502a29cd658dea66001b6536166dc12391546448ff864f61a0fe262876"
          TARGET="ffa879cf17c33084711966097af3cb710cf78e0cf7880f96920166be1ceb3af7"

          if [ "$CURRENT" != "$EXPECTED_BASE" ]; then
            echo "Unexpected index.html base SHA-256: $CURRENT"
            exit 1
          fi

          python - <<'PY'
          import base64, zlib, pathlib
          data = ""
          pathlib.Path('/tmp/qpokoy.patch').write_bytes(zlib.decompress(base64.b64decode(data)))
          PY

          git apply --check --whitespace=nowarn /tmp/qpokoy.patch
          git apply --whitespace=nowarn /tmp/qpokoy.patch

          AFTER="$(sha256sum index.html | awk '{print $1}')"
          if [ "$AFTER" != "$TARGET" ]; then
            echo "Target SHA-256 mismatch: $AFTER"
            exit 1
          fi

          rm -f .github/workflows/qpokoy-mobile-annual-total-deploy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/qpokoy-mobile-annual-total-deploy.yml
          git commit -m "Fix mobile large annual total layout"
          git push origin HEAD:main
