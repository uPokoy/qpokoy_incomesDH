name: One-time offer refund update DEV166

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-offer-dev166.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update refund terms and bump DEV166
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          offer = Path('offer.html')
          text = offer.read_text(encoding='utf-8')

          old_date = '<p class="meta">Редакция от 2 октября 2026 г.</p>'
          new_date = '<p class="meta">Редакция от 3 октября 2026 г.</p>'
          if text.count(old_date) != 1:
              raise SystemExit(f'Expected one old offer revision date, found {text.count(old_date)}')
          text = text.replace(old_date, new_date)

          old_refund = '<p>Потребитель вправе отказаться от исполнения договора в порядке, предусмотренном законодательством РФ, в том числе статьёй 32 Закона «О защите прав потребителей». Заявление об отказе и возврате направляется на <a href="mailto:support@qpokoy.ru">support@qpokoy.ru</a> с данными, достаточными для идентификации платежа, без передачи полного номера банковской карты.</p>\n<p>Возврат рассчитывается и производится с учётом требований действующего законодательства, фактически оказанной услуги и подлежащих подтверждению фактических расходов исполнителя. Сам факт начала доступа или выбор бессрочного тарифа не исключает законные права потребителя на отказ и возврат. Отключение автопродления и требование о расторжении действующего периода — разные действия.</p>'
          new_refund = '<p>Потребитель вправе отказаться от исполнения договора в любое время в порядке, предусмотренном законодательством РФ, в том числе статьёй 32 Закона «О защите прав потребителей». Заявление об отказе и возврате направляется на <a href="mailto:support@qpokoy.ru">support@qpokoy.ru</a>. В заявлении следует указать адрес электронной почты аккаунта, выбранный тариф, дату и сумму платежа и, при наличии, идентификатор платежа. Полный номер банковской карты, CVC/CVV и иные секретные платёжные реквизиты передавать не нужно.</p>\n<p>Право на отказ может быть реализовано после начала предоставления доступа. Размер суммы, подлежащей возврату, определяется в соответствии с законодательством РФ. При расчёте Исполнитель учитывает только те суммы, которые вправе удержать по закону, включая документально подтверждённые фактически понесённые расходы, непосредственно связанные с исполнением обязательств по конкретному договору. Выбор бессрочного тарифа сам по себе не лишает потребителя предусмотренного законом права на отказ.</p>\n<p>Отключение автопродления прекращает только будущие автоматические списания и само по себе не является заявлением об отказе от уже оплаченного периода и возврате средств. Требование о возврате подаётся отдельно. Возврат производится в порядке и сроки, установленные законодательством РФ.</p>'
          if text.count(old_refund) != 1:
              raise SystemExit(f'Expected one old refund section, found {text.count(old_refund)}')
          text = text.replace(old_refund, new_refund)
          offer.write_text(text, encoding='utf-8')

          old_dev = 'dev-2026.10.03.165'
          new_dev = 'dev-2026.10.03.166'

          app = Path('js/app.js')
          app_text = app.read_text(encoding='utf-8')
          if app_text.count(old_dev) != 1:
              raise SystemExit(f'Expected exactly one DEV165 marker in js/app.js, found {app_text.count(old_dev)}')
          app.write_text(app_text.replace(old_dev, new_dev), encoding='utf-8')

          index = Path('index.html')
          index_text = index.read_text(encoding='utf-8')
          if old_dev not in index_text:
              raise SystemExit('DEV165 marker not found in index.html')
          index.write_text(index_text.replace(old_dev, new_dev), encoding='utf-8')
          PY
          git diff --check
          git config user.name "qPokoy GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add offer.html js/app.js index.html
          git commit -m "Clarify refund terms for DEV166"
          git push origin HEAD:main
