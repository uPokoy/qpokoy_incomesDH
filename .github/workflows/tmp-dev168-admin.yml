          # Tests.
          p=Path('backend/test/routes.test.js')
          text=p.read_text(encoding='utf-8')
          if "admin billing panel is server-authorized" in text:
              raise SystemExit('admin route test already exists')
          text=text.rstrip()+"\n"+base64.b64decode('').decode('utf-8').strip()+"\n"
          p.write_text(text,encoding='utf-8')

          p=Path('tests/api-client.test.js')
          text=p.read_text(encoding='utf-8')
          if "admin client uses authenticated status" in text:
              raise SystemExit('admin client test already exists')
          text=text.rstrip()+"\n"+base64.b64decode('').decode('utf-8').strip()+"\n"
          p.write_text(text,encoding='utf-8')

          # DEV marker.
          for name in ['js/app.js','index.html']:
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              if 'dev-2026.10.03.167' not in text:
                  raise SystemExit(f'{name}: DEV167 marker not found')
              p.write_text(text.replace('dev-2026.10.03.167','dev-2026.10.03.168'),encoding='utf-8')
          PY

          (cd backend && npm ci --no-audit --no-fund && npm test)
          node --test tests/api-client.test.js
          node --check backend/app.js
          node --check backend/index.js
          node --check backend/ydb.js
          node --check js/api-client.js
          node --check js/admin.js
          git diff --check

          git config user.name "qPokoy GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app.js backend/index.js backend/test/routes.test.js js/api-client.js tests/api-client.test.js admin.html js/admin.js .github/workflows/frontend-deploy.yml js/app.js index.html
          git commit -m "Add secure admin access panel for DEV168"
          git push origin HEAD:tmp-dev168-admin
