name: Temporary DEV168 admin panel

on:
  push:
    branches:
      - tmp-dev168-admin
    paths:
      - .github/workflows/tmp-dev168-admin.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tmp-dev168-admin

      - name: Patch, test and commit DEV168
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          # Backend: admin rate limits.
          replace_once('backend/app.js',
              "  oauthExchangeIp: { limit: 30, windowMs: 10 * 60 * 1000 }\n});",
              "  oauthExchangeIp: { limit: 30, windowMs: 10 * 60 * 1000 },\n  adminLookupIp: { limit: 120, windowMs: 60 * 60 * 1000 },\n  adminWriteIp: { limit: 60, windowMs: 60 * 60 * 1000 }\n});")

          # Backend: exact admin user-id allowlist supplied by environment.
          replace_once('backend/app.js',
              "  })();\n\n  const isoDate =",
              "  })();\n  const adminUserIds = new Set((Array.isArray(options.adminUserIds) ? options.adminUserIds : String(options.adminUserIds || '').split(','))\n    .map((value) => String(value || '').trim()).filter(Boolean));\n\n  const isoDate =")

          # Backend: manual grants are a supported access source.
          replace_once('backend/app.js',
              "    const plan = ['monthly', 'yearly', 'lifetime'].includes(saved?.plan) ? saved.plan : null;\n    const paidUntil = isoDate(saved?.paid_until);\n    const graceUntil = isoDate(saved?.grace_until);\n    const autoRenew = Boolean(saved?.auto_renew && (plan === 'monthly' || plan === 'yearly'));\n    if (plan === 'lifetime') return { ...base, mode: 'lifetime', status: 'active', plan, source: 'payment' };\n    if ((plan === 'monthly' || plan === 'yearly') && paidUntil && new Date(paidUntil).getTime() > currentMs) {\n      return { ...base, mode: 'paid', status: 'active', plan, auto_renew: autoRenew, paid_until: paidUntil, grace_until: graceUntil };\n    }\n    if ((plan === 'monthly' || plan === 'yearly') && graceUntil && new Date(graceUntil).getTime() > currentMs) {\n      return { ...base, mode: 'grace', status: 'grace', plan, auto_renew: autoRenew, paid_until: paidUntil, grace_until: graceUntil };\n    }",
              "    const plan = ['monthly', 'yearly', 'lifetime', 'manual'].includes(saved?.plan) ? saved.plan : null;\n    const paidUntil = isoDate(saved?.paid_until);\n    const graceUntil = isoDate(saved?.grace_until);\n    const autoRenew = Boolean(saved?.auto_renew && (plan === 'monthly' || plan === 'yearly'));\n    const source = saved?.source === 'admin' ? 'admin' : 'payment';\n    if (plan === 'lifetime') return { ...base, mode: 'lifetime', status: 'active', plan, source };\n    if (['monthly', 'yearly', 'manual'].includes(plan) && paidUntil && new Date(paidUntil).getTime() > currentMs) {\n      return { ...base, mode: 'paid', status: 'active', plan, source, auto_renew: autoRenew, paid_until: paidUntil, grace_until: graceUntil };\n    }\n    if (['monthly', 'yearly', 'manual'].includes(plan) && graceUntil && new Date(graceUntil).getTime() > currentMs) {\n      return { ...base, mode: 'grace', status: 'grace', plan, source, auto_renew: autoRenew, paid_until: paidUntil, grace_until: graceUntil };\n    }")

          helper_b64 = ''
          helper = base64.b64decode(helper_b64).decode('utf-8')
          old_helper = '''  async function requireWriteAccess(user) {
    const access = await billingAccess(user);
    if (!access.can_write) {
      throw new HttpError(402, 'subscription_required',
        'Пробный период или подписка закончились. Доступны просмотр данных, экспорт PDF и удаление аккаунта.');
    }
    return access;
  }

'''
          replace_once('backend/app.js', old_helper, helper)

          route_b64 = ''
          route = base64.b64decode(route_b64).decode('utf-8')
          old_route = '''      if (method === 'GET' && pathname === '/billing/status') return response(200, {
        data: await billingAccess(user), plans: BILLING_PLANS
      });
'''
          replace_once('backend/app.js', old_route, route)

          # Cloud Function gets the allowlist from an environment variable.
          replace_once('backend/index.js',
              "      billingEnforcementStartedAt: process.env.BILLING_ENFORCEMENT_STARTED_AT || '',\n",
              "      billingEnforcementStartedAt: process.env.BILLING_ENFORCEMENT_STARTED_AT || '',\n      adminUserIds: process.env.ADMIN_USER_IDS || '',\n")

          # Frontend API methods used only by the standalone admin page.
          replace_once('js/api-client.js',
              "      async billingStatus(){return (await request('GET','/billing/status')).data;},\n      async listIncomes()",
              "      async billingStatus(){return (await request('GET','/billing/status')).data;},\n      async adminStatus(){return (await request('GET','/admin/status')).data;},\n      async adminFindUser(email){return (await request('GET','/admin/users?email='+encodeURIComponent(email))).data;},\n      async adminSetBilling(userId,body){return (await request('PUT','/admin/users/'+encodeURIComponent(userId)+'/billing',body)).data;},\n      async listIncomes()")

          # Deploy standalone admin page with the normal static frontend.
          replace_once('.github/workflows/frontend-deploy.yml',
              "          cp index.html about.html offer.html pricing.html privacy.html manifest.json site/\n",
              "          cp index.html admin.html about.html offer.html pricing.html privacy.html manifest.json site/\n")

          # Write standalone admin frontend.
          Path('admin.html').write_text(base64.b64decode('').decode('utf-8'),encoding='utf-8')
          Path('js/admin.js').write_text(base64.b64decode('...extra});
    renderUser(payload);
    showMessage('Изменение сохранено.','ok');
  }catch(error){
    showMessage(error?.message||'Не удалось сохранить изменение.','error');
  }
}

searchForm?.addEventListener('submit',event=>{
  event.preventDefault();
  findUser();
});
document.querySelectorAll('[data-action]').forEach(button=>{
  button.addEventListener('click',()=>applyAction(button.dataset.action));
});
setCustomUntil?.addEventListener('click',()=>{
  const value=customUntil?.value||'';
  if(!value){showMessage('Сначала выбери дату.','error');return;}
  applyAction('set_until',{until:value});
});

