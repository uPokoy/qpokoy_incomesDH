name: qPokoy mobile history keyboard nav fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/qpokoy-mobile-history-keyboard-nav.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply mobile history keyboard navigation fix
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(sha256sum index.html | awk '{print $1}')"
          EXPECTED="f2e23a8915b4565fa1b0b81bd2f9d7c911ad40308153ffa334c29bd3fb2e7058"
          TARGET="96c36b88ee8d5e2bb93bc506eb678419fd26963a38d182c63dfdf0287434dad7"
          if [ "$CURRENT" != "$EXPECTED" ]; then
            echo "Unexpected index.html SHA-256: $CURRENT"
            exit 1
          fi
          python - <<'PY2'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          patch='\n<style id="qPokoyMobileHistoryKeyboardNavV1">\n/* Mobile history: while the search field has focus, hide the fixed bottom\n   navigation so iOS cannot lift it above the on-screen keyboard during scroll. */\n@media (max-width:560px){\n  body:has(#history.page.active #historySearch:focus) .sidebar{\n    opacity:0 !important;\n    visibility:hidden !important;\n    pointer-events:none !important;\n    transform:translateY(110%) !important;\n  }\n}\n</style>\n'
          if 'qPokoyMobileHistoryKeyboardNavV1' in s:
              raise SystemExit('Patch already present')
          if '</body>' not in s:
              raise SystemExit('No closing body tag')
          s=s.replace('</body>', patch + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY2
          AFTER="$(sha256sum index.html | awk '{print $1}')"
          if [ "$AFTER" != "$TARGET" ]; then
            echo "Target SHA-256 mismatch: $AFTER"
            exit 1
          fi
          rm -f .github/workflows/qpokoy-mobile-history-keyboard-nav.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/qpokoy-mobile-history-keyboard-nav.yml
          git commit -m "Fix mobile history nav over keyboard"
          git push origin HEAD:main
