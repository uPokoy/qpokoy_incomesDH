name: Frontend deploy to Yandex Object Storage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qpokoy-frontend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare frontend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp index.html about.html offer.html pricing.html privacy.html manifest.json site/
          cp -R css js icons site/

      - name: Install AWS CLI
        run: |
          python -m pip install --upgrade pip
          pip install awscli

      - name: Deploy to Yandex Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          aws s3 sync site/ s3://qpokoy.ru \
            --endpoint-url=https://storage.yandexcloud.net \
            --delete \
            --only-show-errors
