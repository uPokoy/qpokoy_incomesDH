name: Frontend deploy to Yandex Object Storage

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'admin.html'
      - 'about.html'
      - 'service.html'
      - 'offer.html'
      - 'pricing.html'
      - 'privacy.html'
      - 'manifest.json'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qpokoy-frontend-deploy
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test dependency manager
        uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'

      - name: Install frontend test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Frontend API and DOM regression tests
        run: node --test tests/*.test.js

      - name: Frontend syntax and HTML/CSS structure
        run: node tests/helpers/check-project.js

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend tests
        working-directory: backend
        run: npm test

      - name: Backend syntax check
        working-directory: backend
        run: |
          node --check index.js
          node --check app.js
          node --check category-router.js
          node --check admin-billing.js
          node --check admin-receipt.js
          node --check billing-payments.js
          node --check payment-router.js
          node --check yookassa.js
          node --check renewals.js
          node --check precharge-notifications.js
          node --check precharge-test.js
          node --check receipt-mail.js
          node --check ydb.js
          node --check ydb-core.js
          node --check security.js
          node --check mail.js
          node --check oauth.js

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare frontend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp index.html admin.html about.html service.html offer.html pricing.html privacy.html manifest.json robots.txt sitemap.xml site/
          cp -R css js icons site/

          # Stable baseline: the production tree after Stage 2 corresponds to DEV363.
          # Every later main commit gets the next DEV number automatically.
          dev_base_sha="3ffb73e473f2eabca1904023b84d75c93468113c"
          dev_base_number=363
          if ! git cat-file -e "${dev_base_sha}^{commit}"; then
            echo "DEV baseline commit is unavailable: ${dev_base_sha}" >&2
            exit 1
          fi
          commits_since_base="$(git rev-list --count "${dev_base_sha}..HEAD")"
          dev_number="$((dev_base_number + commits_since_base))"
          commit_date="$(git show -s --format=%cs HEAD | tr '-' '.')"
          version_label="${commit_date}.${dev_number}"
          dev_label="dev-${version_label}"
          python - "$dev_label" "$version_label" <<'PY'
          import re
          import sys
          from pathlib import Path

          label = sys.argv[1]
          display_label = sys.argv[2]

          index = Path('site/index.html')
          text = index.read_text(encoding='utf-8')
          text, count = re.subn(
              r'(<strong id="qPokoyDevVersion">)dev-\d{4}\.\d{2}\.\d{2}\.\d+(</strong>)',
              rf'\g<1>{display_label}\g<2>',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('qPokoyDevVersion marker not found')
          index.write_text(text, encoding='utf-8')

          app = Path('site/js/app.js')
          app_text = app.read_text(encoding='utf-8')
          app_text, count = re.subn(
              r"const qPokoyDevVersion='dev-\d{4}\.\d{2}\.\d{2}\.\d+';",
              f"const qPokoyDevVersion='{display_label}';",
              app_text,
              count=1,
          )
          if count != 1:
              raise SystemExit('qPokoyDevVersion runtime constant not found')
          app.write_text(app_text, encoding='utf-8')

          asset_pattern = re.compile(
              r'((?:src|href)="(?:js|css)/[^"?]+\.(?:js|css))(?:\?v=[^"]*)?"'
          )
          for path in Path('site').glob('*.html'):
              html = path.read_text(encoding='utf-8')
              html = asset_pattern.sub(rf'\1?v={label}"', html)
              path.write_text(html, encoding='utf-8')
          PY

      - name: Install AWS CLI
        run: |
          python -m pip install --upgrade pip
          pip install awscli

      - name: Deploy to Yandex Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          aws s3 sync site/ s3://qpokoy.ru \
            --endpoint-url=https://storage.yandexcloud.net \
            --delete \
            --only-show-errors

          aws s3 cp site/ s3://qpokoy.ru/ \
            --endpoint-url=https://storage.yandexcloud.net \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --only-show-errors

          aws s3 cp site/manifest.json s3://qpokoy.ru/manifest.json \
            --endpoint-url=https://storage.yandexcloud.net \
            --cache-control "no-cache, no-store, must-revalidate" \
            --only-show-errors
