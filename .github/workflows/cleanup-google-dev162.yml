name: One-time Google OAuth cleanup DEV162

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-google-dev162.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove Google OAuth client fallback and bump DEV162
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          api = Path('js/api-client.js')
          api_text = api.read_text(encoding='utf-8')
          old_guard = "if(!['google','yandex'].includes(provider))"
          new_guard = "if(provider!=='yandex')"
          if api_text.count(old_guard) != 1:
              raise SystemExit(f'Expected exactly one old OAuth provider guard, found {api_text.count(old_guard)}')
          api.write_text(api_text.replace(old_guard, new_guard), encoding='utf-8')

          old_dev = 'dev-2026.10.03.161'
          new_dev = 'dev-2026.10.03.162'

          app = Path('js/app.js')
          app_text = app.read_text(encoding='utf-8')
          if app_text.count(old_dev) != 1:
              raise SystemExit(f'Expected exactly one DEV161 marker in js/app.js, found {app_text.count(old_dev)}')
          app.write_text(app_text.replace(old_dev, new_dev), encoding='utf-8')

          index = Path('index.html')
          index_text = index.read_text(encoding='utf-8')
          if old_dev not in index_text:
              raise SystemExit('DEV161 marker not found in index.html')
          index.write_text(index_text.replace(old_dev, new_dev), encoding='utf-8')
          PY
          git diff --check
          git config user.name "qPokoy GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add js/api-client.js js/app.js index.html
          git commit -m "Remove Google OAuth client fallback in DEV162"
          git push origin HEAD:main
