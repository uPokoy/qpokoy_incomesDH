name: qPokoy mobile history cards only

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/qpokoy-mobile-history-cards-only.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mobile history cards CSS only
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(sha256sum index.html | awk '{print $1}')"
          EXPECTED="96c36b88ee8d5e2bb93bc506eb678419fd26963a38d182c63dfdf0287434dad7"
          TARGET="432b5d3a7273c28cb0d4dc9869047ecd762a5568e080fcd124aa4b5bc9c649be"
          if [ "$CURRENT" != "$EXPECTED" ]; then
            echo "Unexpected index.html base: $CURRENT"
            exit 1
          fi
          python - <<'PY2'
          import base64,zlib,pathlib
          data=""
          pathlib.Path('/tmp/history-cards.patch').write_bytes(zlib.decompress(base64.b64decode(data)))
          PY2
          git apply --check --whitespace=nowarn /tmp/history-cards.patch
          git apply --whitespace=nowarn /tmp/history-cards.patch
          AFTER="$(sha256sum index.html | awk '{print $1}')"
          if [ "$AFTER" != "$TARGET" ]; then
            echo "Target mismatch: $AFTER"
            exit 1
          fi
          rm -f .github/workflows/qpokoy-mobile-history-cards-only.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/qpokoy-mobile-history-cards-only.yml
          git commit -m "Improve mobile history card readability"
          git push origin HEAD:main
