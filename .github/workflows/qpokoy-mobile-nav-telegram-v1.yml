name: qPokoy Telegram-style phone navigation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qpokoy-mobile-nav-telegram-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch mobile navigation CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<style id="qPokoyMobileBottomNavGlassV2">'
          a=s.index(marker)
          b=s.index('</style>',a)+len('</style>')
          block=s[a:b]
          if 'bottom:calc(3px + env(safe-area-inset-bottom)) !important;' not in block:
              raise SystemExit('Unexpected mobile nav source')
          block=block.replace('background:color-mix(in srgb,var(--panel) 72%,transparent) !important;','background:color-mix(in srgb,var(--panel) 68%,transparent) !important;',1)
          block=block.replace('border:1px solid color-mix(in srgb,var(--border) 70%,rgba(255,255,255,.18)) !important;','border:1px solid color-mix(in srgb,var(--border) 66%,rgba(255,255,255,.20)) !important;',1)
          block=block.replace('border-radius:22px !important;','border-radius:28px !important;',1)
          block=block.replace('0 10px 30px rgba(0,0,0,.30),\n      inset 0 1px 0 rgba(255,255,255,.055),','0 12px 34px rgba(0,0,0,.34),\n      0 0 0 1px rgba(255,255,255,.018),\n      inset 0 1px 0 rgba(255,255,255,.075),',1)
          block=block.replace('-webkit-backdrop-filter:blur(24px) saturate(140%) !important;\n    backdrop-filter:blur(24px) saturate(140%) !important;','-webkit-backdrop-filter:blur(28px) saturate(150%) !important;\n    backdrop-filter:blur(28px) saturate(150%) !important;',1)
          block=block.replace('height:100% !important;\n    margin:0 !important;\n    padding:7px 4px !important;\n    border:0 !important;\n    border-radius:0 !important;','height:calc(100% - 8px) !important;\n    margin:4px 2px !important;\n    padding:6px 4px !important;\n    border:1px solid transparent !important;\n    border-radius:24px !important;',1)
          block=block.replace('  .sidebar > .nav-item.active{\n    border-radius:0 !important;\n    background:transparent !important;\n    box-shadow:none !important;\n    color:var(--primary) !important;\n  }','  .sidebar > .nav-item.active{\n    border-radius:24px !important;\n    background:linear-gradient(180deg,color-mix(in srgb,var(--primary) 8%,rgba(255,255,255,.115)),color-mix(in srgb,var(--primary) 6%,rgba(255,255,255,.065))) !important;\n    border:1px solid color-mix(in srgb,var(--primary) 20%,rgba(255,255,255,.12)) !important;\n    box-shadow:0 6px 18px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.10),inset 0 -1px 0 rgba(0,0,0,.10) !important;\n    color:var(--primary) !important;\n  }',1)
          block=block.replace('width:22px !important;\n    height:22px !important;','width:23px !important;\n    height:23px !important;',1)
          block=block.replace('font-size:10.5px !important;','font-size:11px !important;',1)
          s=s[:a]+block+s[b:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile,os
          s=Path('index.html').read_text(encoding='utf-8')
          a=len(re.findall(r'<style\b',s,re.I)); b=len(re.findall(r'</style\s*>',s,re.I))
          c=len(re.findall(r'<script\b',s,re.I)); d=len(re.findall(r'</script\s*>',s,re.I))
          print(f'style tags: {a} / {b}')
          print(f'script tags: {c} / {d}')
          assert a==b and c==d
          n=0
          for attrs,body in re.findall(r'<script\b([^>]*)>(.*?)</script\s*>',s,re.I|re.S):
              if re.search(r'\bsrc\s*=',attrs,re.I): continue
              n+=1
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                  f.write(body); name=f.name
              try:
                  subprocess.run(['node','--check',name],check=True)
              finally:
                  os.unlink(name)
          print(f'inline scripts checked: {n}')
          PY
      - name: Commit patch
        run: |
          git config user.name "uPokoy"
          git config user.email "120357426+uPokoy@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Apply Telegram-style phone glass navigation"
          git push origin main
