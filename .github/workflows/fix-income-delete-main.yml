name: Fix income delete confirmation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate delete handler
        run: >-
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); old=\"incomeList.addEventListener('click',e=>{\\n  const editButton=e.target.closest('.edit-income');\\n  if(editButton){\\n    openHistoryEdit(editButton.dataset.id);\\n    return;\\n  }\\n  const deleteButton=e.target.closest('.delete-income');\\n  if(deleteButton){\\n    IncomeStore.remove(deleteButton.dataset.id);\\n    renderIncomes();\\n  }\\n});\\n\"; new=\"incomeList.addEventListener('click',e=>{\\n  const editButton=e.target.closest('.edit-income');\\n  if(editButton){\\n    openHistoryEdit(editButton.dataset.id);\\n    return;\\n  }\\n});\\n\"; assert old in s, 'duplicate delete handler not found'; p.write_text(s.replace(old,new,1),encoding='utf-8')"
      - name: Commit index fix and remove temporary files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/fix-income-delete-main.yml _fix-income-delete-trigger.txt || true
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix income delete confirmation'
          git push
