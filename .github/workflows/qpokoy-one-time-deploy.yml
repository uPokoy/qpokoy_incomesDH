name: qPokoy one-time deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/qpokoy-one-time-deploy.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified qPokoy build
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import base64,zlib,pathlib; pathlib.Path("/tmp/qpokoy.patch").write_bytes(zlib.decompress(base64.b64decode("")))'
          git apply --check /tmp/qpokoy.patch
          git apply /tmp/qpokoy.patch
          echo "ca45dae78786deec427b80d6a1694d7591c031c15dfa2ce4816d2ee0344f2a59  index.html" | sha256sum -c -
          test "$(wc -c < index.html)" = "543536"
          git rm .github/workflows/qpokoy-one-time-deploy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy verified qPokoy fixes"
          git push origin HEAD:main
