name: One-time GitHub Pages CNAME cleanup DEV163

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-cname-dev163.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove obsolete CNAME and bump DEV163
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          cname = Path('CNAME')
          if not cname.exists() or cname.read_text(encoding='utf-8').strip() != 'qpokoy.ru':
              raise SystemExit('Expected obsolete CNAME with qpokoy.ru')
          cname.unlink()

          old_dev = 'dev-2026.10.03.162'
          new_dev = 'dev-2026.10.03.163'

          app = Path('js/app.js')
          app_text = app.read_text(encoding='utf-8')
          if app_text.count(old_dev) != 1:
              raise SystemExit(f'Expected exactly one DEV162 marker in js/app.js, found {app_text.count(old_dev)}')
          app.write_text(app_text.replace(old_dev, new_dev), encoding='utf-8')

          index = Path('index.html')
          index_text = index.read_text(encoding='utf-8')
          if old_dev not in index_text:
              raise SystemExit('DEV162 marker not found in index.html')
          index.write_text(index_text.replace(old_dev, new_dev), encoding='utf-8')
          PY
          git diff --check
          git config user.name "qPokoy GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A CNAME js/app.js index.html
          git commit -m "Remove obsolete GitHub Pages CNAME in DEV163"
          git push origin HEAD:main
