# Advisory-only scan: reports suspected leaks but never blocks main or deployment.
name: Secret scan (advisory)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks advisory check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan new changes for secrets (non-blocking)
        id: scan
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

      - name: Show warning when attention is required
        if: steps.scan.outcome == 'failure'
        run: echo "::warning::Secret scan reported a possible leak or could not complete. Review the Gitleaks log; this advisory check does not block development or deployment."
