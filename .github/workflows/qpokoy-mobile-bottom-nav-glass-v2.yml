name: qPokoy mobile bottom nav glass v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/qpokoy-mobile-bottom-nav-glass-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Match phone glass navigation to mockup
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB="afbd552b52ed37cbac02554d3ab1c9c29c1583ca"
          CURRENT_BLOB="$(git hash-object index.html)"
          test "$CURRENT_BLOB" = "$EXPECTED_BLOB"

          python3 - <<'PY'
          from pathlib import Path
          import base64, re, subprocess, tempfile, os

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old_pattern=r'<style id="qPokoyMobileBottomNavGlassV1">.*?</style>'
          matches=re.findall(old_pattern,s,re.S)
          if len(matches)!=1:
              raise SystemExit(f'Expected one V1 glass style, found {len(matches)}')
          if 'qPokoyMobileBottomNavGlassV2' in s:
              raise SystemExit('V2 patch already present')

          new=base64.b64decode('').decode('utf-8')
          s,n=re.subn(old_pattern,new,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('Glass style replacement failed')
          p.write_text(s,encoding='utf-8')

          s=p.read_text(encoding='utf-8')
          so=len(re.findall(r'<style\b',s,re.I)); sc=len(re.findall(r'</style\s*>',s,re.I))
          jo=len(re.findall(r'<script\b',s,re.I)); jc=len(re.findall(r'</script\s*>',s,re.I))
          print(f'style {so}/{sc}')
          print(f'script {jo}/{jc}')
          if so != sc or jo != jc:
              raise SystemExit('Unbalanced style/script tags')
          if s.count('qPokoyMobileBottomNavGlassV1') != 0:
              raise SystemExit('Old V1 glass marker still present')
          if s.count('qPokoyMobileBottomNavGlassV2') != 1:
              raise SystemExit('V2 glass marker mismatch')
          if 'data-nav-label-mode="icons"' not in new or 'data-nav-label-mode="text"' not in new:
              raise SystemExit('Navigation display modes not preserved')

          scripts=re.findall(r'<script\b([^>]*)>(.*?)</script\s*>',s,re.I|re.S)
          checked=0
          for attrs,body in scripts:
              if re.search(r'\bsrc\s*=',attrs,re.I):
                  continue
              checked+=1
              with tempfile.NamedTemporaryFile('w',suffix='.js',encoding='utf-8',delete=False) as f:
                  f.write(body)
                  name=f.name
              r=subprocess.run(['node','--check',name],capture_output=True,text=True)
              os.unlink(name)
              if r.returncode:
                  print(r.stdout)
                  print(r.stderr)
                  raise SystemExit(f'JS syntax error in inline script #{checked}')
          print(f'inline_js_checked {checked}')
          PY

          rm -f .github/workflows/qpokoy-mobile-bottom-nav-glass-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/qpokoy-mobile-bottom-nav-glass-v2.yml
          git commit -m "Match phone glass navigation to mockup"
          git push origin HEAD:main
