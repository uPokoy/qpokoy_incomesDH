name: qPokoy final verified deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/qpokoy-final-verified-deploy.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy verified final qPokoy file
        shell: bash
        run: |
          set -euo pipefail

          CURRENT="$(sha256sum index.html | awk '{print $1}')"
          EXPECTED_BASE="ffa879cf17c33084711966097af3cb710cf78e0cf7880f96920166be1ceb3af7"
          TARGET="f2e23a8915b4565fa1b0b81bd2f9d7c911ad40308153ffa334c29bd3fb2e7058"

          if [ "$CURRENT" != "$EXPECTED_BASE" ]; then
            echo "Unexpected index.html base SHA-256: $CURRENT"
            exit 1
          fi

          python - <<'PY'
          import base64, zlib, pathlib
          data = ""
          pathlib.Path('/tmp/qpokoy-final.patch').write_bytes(
              zlib.decompress(base64.b64decode(data))
          )
          PY

          git apply --check --whitespace=nowarn /tmp/qpokoy-final.patch
          git apply --whitespace=nowarn /tmp/qpokoy-final.patch

          AFTER="$(sha256sum index.html | awk '{print $1}')"
          if [ "$AFTER" != "$TARGET" ]; then
            echo "Target SHA-256 mismatch: $AFTER"
            exit 1
          fi

          rm -f .github/workflows/qpokoy-final-verified-deploy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/qpokoy-final-verified-deploy.yml
          git commit -m "Publish final verified qPokoy version"
          git push origin HEAD:main
