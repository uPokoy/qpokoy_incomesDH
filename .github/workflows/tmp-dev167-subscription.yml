name: Temporary DEV167 subscription foundation

on:
  push:
    branches:
      - tmp-dev167-subscription
    paths:
      - .github/workflows/tmp-dev167-subscription.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temp branch
        uses: actions/checkout@v4
        with:
          ref: tmp-dev167-subscription

      - name: Add subscription access foundation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # backend/app.js: constants
          replace_once('backend/app.js',
              "const OAUTH_TICKET_TTL_MS = 2 * 60 * 1000;\n",
              "const OAUTH_TICKET_TTL_MS = 2 * 60 * 1000;\nconst BILLING_ACCESS_SETTING = 'billing.access';\nconst BILLING_PLANS = Object.freeze({\n  monthly: { code: 'monthly', price_rub: 149, period: 'month' },\n  yearly: { code: 'yearly', price_rub: 1190, period: 'year' },\n  lifetime: { code: 'lifetime', price_rub: 1790, period: 'lifetime' }\n});\n")

          # backend/app.js: billing evaluator and write guard
          anchor = "  const rateLimits = { ...RATE_LIMITS, ...(options.rateLimits || {}) };\n\n"
          insert = """  const rateLimits = { ...RATE_LIMITS, ...(options.rateLimits || {}) };\n  const billingEnforcementStartedAt = (() => {\n    const value = options.billingEnforcementStartedAt;\n    if (!value) return null;\n    const parsed = value instanceof Date ? new Date(value) : new Date(String(value));\n    return Number.isFinite(parsed.getTime()) ? parsed : null;\n  })();\n\n  const isoDate = (value) => {\n    if (!value) return null;\n    const parsed = value instanceof Date ? new Date(value) : new Date(String(value));\n    return Number.isFinite(parsed.getTime()) ? parsed.toISOString() : null;\n  };\n  async function billingAccess(user) {\n    const current = now();\n    const currentMs = current.getTime();\n    const trialEndsAt = isoDate(user?.trial_ends_at);\n    const base = {\n      can_read: true, can_export_pdf: true, can_delete_account: true,\n      can_write: true, auto_renew: false, paid_until: null, grace_until: null,\n      trial_ends_at: trialEndsAt\n    };\n    if (!billingEnforcementStartedAt || currentMs < billingEnforcementStartedAt.getTime()) {\n      return { ...base, mode: 'prelaunch', status: 'active', plan: null };\n    }\n    const createdAt = user?.created_at ? new Date(user.created_at) : null;\n    if (createdAt && Number.isFinite(createdAt.getTime()) && createdAt < billingEnforcementStartedAt) {\n      return { ...base, mode: 'lifetime', status: 'active', plan: 'lifetime', source: 'legacy' };\n    }\n\n    let saved = null;\n    try {\n      const row = await store.getSetting(user.user_id, BILLING_ACCESS_SETTING);\n      saved = row?.setting_value ? JSON.parse(row.setting_value) : null;\n    } catch (_) { saved = null; }\n    const plan = ['monthly', 'yearly', 'lifetime'].includes(saved?.plan) ? saved.plan : null;\n    const paidUntil = isoDate(saved?.paid_until);\n    const graceUntil = isoDate(saved?.grace_until);\n    const autoRenew = Boolean(saved?.auto_renew && (plan === 'monthly' || plan === 'yearly'));\n    if (plan === 'lifetime') {\n      return { ...base, mode: 'lifetime', status: 'active', plan, source: 'payment' };\n    }\n    if ((plan === 'monthly' || plan === 'yearly') && paidUntil && new Date(paidUntil).getTime() > currentMs) {\n      return { ...base, mode: 'paid', status: 'active', plan, auto_renew: autoRenew, paid_until: paidUntil, grace_until: graceUntil };\n    }\n    if ((plan === 'monthly' || plan === 'yearly') && graceUntil && new Date(graceUntil).getTime() > currentMs) {\n      return { ...base, mode: 'grace', status: 'grace', plan, auto_renew: autoRenew, paid_until: paidUntil, grace_until: graceUntil };\n    }\n    if (trialEndsAt && new Date(trialEndsAt).getTime() > currentMs) {\n      return { ...base, mode: 'trial', status: 'active', plan: 'trial' };\n    }\n    return { ...base, can_write: false, mode: 'expired', status: 'expired', plan: plan || null,\n      auto_renew: autoRenew, paid_until: paidUntil, grace_until: graceUntil };\n  }\n  async function requireWriteAccess(user) {\n    const access = await billingAccess(user);\n    if (!access.can_write) {\n      throw new HttpError(402, 'subscription_required',\n        'Пробный период или подписка закончились. Доступны просмотр данных, экспорт PDF и удаление аккаунта.');\n    }\n    return access;\n  }\n\n"""
          replace_once('backend/app.js', anchor, insert)

          # backend/app.js: expose billing state in bootstrap responses
          replace_once('backend/app.js',
              "        if (startup.not_modified) return response(200, {\n          user: publicUser(startup.user), revision: startup.revision, not_modified: true\n        });\n        return response(200, {\n          revision: startup.revision, not_modified: false,\n          user: publicUser(startup.user), incomes: startup.incomes, categories: startup.categories,\n          settings: startup.settings.filter((row) => !/^(auth|system|rate)\\./.test(String(row.setting_key)))\n        });",
              "        if (startup.not_modified) return response(200, {\n          user: publicUser(startup.user), revision: startup.revision, not_modified: true,\n          billing: await billingAccess(startup.user)\n        });\n        return response(200, {\n          revision: startup.revision, not_modified: false,\n          user: publicUser(startup.user), incomes: startup.incomes, categories: startup.categories,\n          settings: startup.settings.filter((row) => !/^(auth|system|rate|billing)\\./.test(String(row.setting_key))),\n          billing: await billingAccess(startup.user)\n        });")

          # backend/app.js: status endpoint and guards on all data mutations
          replace_once('backend/app.js',
              "      if (method === 'GET' && pathname === '/auth/me') return response(200, { user: publicUser(user) });\n",
              "      if (method === 'GET' && pathname === '/auth/me') return response(200, { user: publicUser(user) });\n      if (method === 'GET' && pathname === '/billing/status') return response(200, {\n        data: await billingAccess(user), plans: BILLING_PLANS\n      });\n")

          guards = [
              ("      if (pathname === '/incomes' && method === 'DELETE') {\n        await store.deleteAllIncomes(userId);",
               "      if (pathname === '/incomes' && method === 'DELETE') {\n        await requireWriteAccess(user);\n        await store.deleteAllIncomes(userId);"),
              ("      if (pathname === '/incomes' && method === 'POST') {\n        const value = incomeValue(body);",
               "      if (pathname === '/incomes' && method === 'POST') {\n        await requireWriteAccess(user);\n        const value = incomeValue(body);"),
              ("      if (pathname === '/incomes/replace' && method === 'POST') {\n        if (!Array.isArray(body.incomes))",
               "      if (pathname === '/incomes/replace' && method === 'POST') {\n        await requireWriteAccess(user);\n        if (!Array.isArray(body.incomes))"),
              ("      if (incomeMatch && (method === 'PUT' || method === 'PATCH')) {\n        const id = uuidValue(incomeMatch[1]);",
               "      if (incomeMatch && (method === 'PUT' || method === 'PATCH')) {\n        await requireWriteAccess(user);\n        const id = uuidValue(incomeMatch[1]);"),
              ("      if (incomeMatch && method === 'DELETE') {\n        const id = uuidValue(incomeMatch[1]);",
               "      if (incomeMatch && method === 'DELETE') {\n        await requireWriteAccess(user);\n        const id = uuidValue(incomeMatch[1]);"),
              ("      if (pathname === '/categories' && method === 'POST') {\n        const name = requiredString(body.name, 'name', 80).replace(/\\s+/g, ' ');",
               "      if (pathname === '/categories' && method === 'POST') {\n        await requireWriteAccess(user);\n        const name = requiredString(body.name, 'name', 80).replace(/\\s+/g, ' ');"),
              ("      if (categoryMatch && method === 'DELETE') {\n        const id = uuidValue(categoryMatch[1]);",
               "      if (categoryMatch && method === 'DELETE') {\n        await requireWriteAccess(user);\n        const id = uuidValue(categoryMatch[1]);"),
              ("      if (settingMatch && method === 'PUT') {\n        const key = requiredString(decodeURIComponent(settingMatch[1]), 'setting_key', 80);",
               "      if (settingMatch && method === 'PUT') {\n        await requireWriteAccess(user);\n        const key = requiredString(decodeURIComponent(settingMatch[1]), 'setting_key', 80);")
          ]
          for old, new in guards:
              replace_once('backend/app.js', old, new)

          replace_once('backend/app.js',
              "      if (pathname === '/settings' && method === 'GET') return response(200, {\n        data: (await store.listSettings(userId)).filter(row => row.setting_key !== 'system.data_revision')\n      });",
              "      if (pathname === '/settings' && method === 'GET') return response(200, {\n        data: (await store.listSettings(userId)).filter(row => !/^(auth|system|rate|billing)\\./.test(String(row.setting_key)))\n      });")
          replace_once('backend/app.js',
              "        if (key === 'system.data_revision') throw new HttpError(403, 'reserved_setting', 'Data revision is server-managed');",
              "        if (/^(auth|system|rate|billing)\\./.test(key)) throw new HttpError(403, 'reserved_setting', 'This setting is server-managed');")

          # backend/ydb.js: billing settings are server-internal and do not affect data revision
          replace_once('backend/ydb.js',
              "const internalSetting = (key) => /^(auth|system|rate)\\./.test(key);",
              "const internalSetting = (key) => /^(auth|system|rate|billing)\\./.test(key);")

          # backend/index.js: enforcement remains OFF until this env var is explicitly configured at monetization launch
          replace_once('backend/index.js',
              "      requireEmailVerification: String(process.env.REQUIRE_EMAIL_VERIFICATION || '').toLowerCase() === 'true',\n",
              "      requireEmailVerification: String(process.env.REQUIRE_EMAIL_VERIFICATION || '').toLowerCase() === 'true',\n      billingEnforcementStartedAt: process.env.BILLING_ENFORCEMENT_STARTED_AT || '',\n")

          # frontend API client: status call is ready for the future 'Моя подписка' screen
          replace_once('js/api-client.js',
              "      async deleteAccount(){await request('DELETE','/auth/me');clearToken();},\n      async listIncomes()",
              "      async deleteAccount(){await request('DELETE','/auth/me');clearToken();},\n      async billingStatus(){return (await request('GET','/billing/status')).data;},\n      async listIncomes()")

          # test store: billing.* behaves like an internal setting
          replace_once('backend/test/routes.test.js',
              "    putSetting: async (row) => { settings.set(key(row.user_id, row.setting_key), row); if (!/^(auth|system|rate)\\./.test(row.setting_key)) bump(row.user_id); },",
              "    putSetting: async (row) => { settings.set(key(row.user_id, row.setting_key), row); if (!/^(auth|system|rate|billing)\\./.test(row.setting_key)) bump(row.user_id); },")

          tests = r'''

test('billing access preserves legacy users and makes expired accounts read-only', async () => {
  const store = memoryStore();
  let clock = new Date('2026-09-30T12:00:00.000Z');
  const app = createApp(store, {
    requireEmailVerification: false,
    billingEnforcementStartedAt: '2026-10-01T00:00:00.000Z',
    now: () => new Date(clock)
  });
  const legacy = (await register(app, 'legacy-billing@example.com')).body;
  const legacyHeaders = auth(legacy.token);
  clock = new Date('2026-10-20T12:00:00.000Z');
  let status = await app.handle('GET', '/billing/status', {}, legacyHeaders);
  assert.equal(status.status, 200);
  assert.equal(status.body.data.mode, 'lifetime');
  assert.equal(status.body.data.source, 'legacy');
  assert.equal(status.body.data.can_write, true);
  assert.equal((await app.handle('POST', '/incomes', {
    income_date: '2026-10-20', category: 'Зарплата', description: 'Legacy', amount: 100
  }, legacyHeaders)).status, 201);

  clock = new Date('2026-10-02T12:00:00.000Z');
  const fresh = (await register(app, 'trial-billing@example.com')).body;
  const freshHeaders = auth(fresh.token);
  status = await app.handle('GET', '/billing/status', {}, freshHeaders);
  assert.equal(status.body.data.mode, 'trial');
  assert.equal(status.body.data.can_write, true);
  assert.equal((await app.handle('GET', '/bootstrap', {}, freshHeaders)).body.billing.mode, 'trial');

  clock = new Date('2026-10-17T12:00:00.000Z');
  status = await app.handle('GET', '/billing/status', {}, freshHeaders);
  assert.equal(status.body.data.mode, 'expired');
  assert.equal(status.body.data.can_write, false);
  assert.equal((await app.handle('POST', '/incomes', {
    income_date: '2026-10-17', category: 'Зарплата', description: 'Blocked', amount: 100
  }, freshHeaders)).status, 402);
  assert.equal((await app.handle('GET', '/incomes', {}, freshHeaders)).status, 200);
  assert.equal((await app.handle('DELETE', '/auth/me', {}, freshHeaders)).status, 204);
});

test('billing payment and grace state are server-managed and keep writes enabled only while entitled', async () => {
  const store = memoryStore();
  let clock = new Date('2026-10-02T12:00:00.000Z');
  const app = createApp(store, {
    requireEmailVerification: false,
    billingEnforcementStartedAt: '2026-10-01T00:00:00.000Z',
    now: () => new Date(clock)
  });
  const account = (await register(app, 'paid-billing@example.com')).body;
  const headers = auth(account.token);
  const uid = account.user.user_id;
  const initial = (await app.handle('GET', '/bootstrap', {}, headers)).body;
  await store.putSetting({
    user_id: uid,
    setting_key: 'billing.access',
    setting_value: JSON.stringify({
      plan: 'monthly',
      paid_until: '2026-10-25T00:00:00.000Z',
      grace_until: '2026-10-28T00:00:00.000Z',
      auto_renew: true
    }),
    updated_at: clock
  });
  const cached = (await app.handle('GET', '/bootstrap?revision=' + encodeURIComponent(initial.revision), {}, headers)).body;
  assert.equal(cached.not_modified, true);
  assert.equal(cached.billing.mode, 'paid');
  assert.equal(cached.billing.auto_renew, true);
  assert.equal(cached.settings, undefined);
  assert.equal((await app.handle('GET', '/settings', {}, headers)).body.data.some(row => row.setting_key === 'billing.access'), false);
  assert.equal((await app.handle('PUT', '/settings/billing.access', { setting_value: '{}' }, headers)).status, 403);

  clock = new Date('2026-10-26T12:00:00.000Z');
  assert.equal((await app.handle('GET', '/billing/status', {}, headers)).body.data.mode, 'grace');
  assert.equal((await app.handle('POST', '/categories', { name: 'Grace category' }, headers)).status, 201);

  clock = new Date('2026-10-29T12:00:00.000Z');
  assert.equal((await app.handle('GET', '/billing/status', {}, headers)).body.data.mode, 'expired');
  assert.equal((await app.handle('POST', '/categories', { name: 'Blocked category' }, headers)).status, 402);
});
'''
          p = Path('backend/test/routes.test.js')
          text = p.read_text(encoding='utf-8')
          if "billing access preserves legacy users" in text:
              raise SystemExit('billing tests already exist')
          p.write_text(text.rstrip() + tests + '\n', encoding='utf-8')

          # DEV bump
          for name in ['js/app.js', 'index.html']:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if 'dev-2026.10.03.166' not in text:
                  raise SystemExit(f'{name}: DEV166 marker not found')
              p.write_text(text.replace('dev-2026.10.03.166', 'dev-2026.10.03.167'), encoding='utf-8')
          PY

          (cd backend && npm ci --no-audit --no-fund && npm test)
          node --test tests/api-client.test.js
          node --check backend/app.js
          node --check backend/index.js
          node --check backend/ydb.js
          node --check js/api-client.js
          git diff --check

          git config user.name "qPokoy GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app.js backend/index.js backend/ydb.js backend/test/routes.test.js js/api-client.js js/app.js index.html
          git commit -m "Add subscription access foundation for DEV167"
          git push origin HEAD:tmp-dev167-subscription
