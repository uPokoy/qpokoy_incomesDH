<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Учёт доходов</title>
<style id="qPokoy-consolidated">
/* qPokoy — consolidated interface styles */

/* 1. Design tokens and reset */
:root {
  --bg: #f4f6f8;
  --bg-accent: #e8eef5;
  --panel: #ffffff;
  --panel-muted: #f8fafc;
  --text: #1f2937;
  --text-muted: #6b7280;
  --border: #dfe4ea;
  --active: #e8eef5;
  --primary: #2563eb;
  --danger: #dc2626;
  --success: #16a34a;
  --icon-color: #6b7280;
  --shadow-sm: 0 2px 8px rgba(15, 23, 42, .06);
  --shadow-md: 0 12px 30px rgba(15, 23, 42, .10);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
}

* { box-sizing: border-box; }
html { min-width: 320px; background: var(--bg); }
body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 Arial, sans-serif;
  transition: background .2s ease, color .2s ease;
}
button, input, select { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--primary) 35%, transparent);
  outline-offset: 2px;
}
[hidden] { display: none !important; }

body.dark {
  --bg: #0b1018;
  --bg-accent: #111a27;
  --panel: #121a25;
  --panel-muted: #192332;
  --text: #eef3f8;
  --text-muted: #aab5c4;
  --border: #2a3849;
  --active: #233044;
  --shadow-sm: 0 2px 9px rgba(0, 0, 0, .22);
  --shadow-md: 0 14px 34px rgba(0, 0, 0, .28);
}

/* 2. App shell and bottom navigation */
.app { min-height: 100vh; }
.content { min-height: 100vh; padding-bottom: 86px; }
header {
  height: 64px;
  display: flex;
  align-items: center;
  padding: 0 clamp(18px, 4vw, 44px);
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  border-bottom: 1px solid var(--border);
}
header h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
main { width: min(1180px, 100%); margin: 0 auto; padding: clamp(18px, 3vw, 34px); }
.page { display: none; }
.page.active { display: block; }

.sidebar {
  position: fixed;
  z-index: 1000;
  right: 0;
  bottom: 0;
  left: 0;
  height: 68px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  align-items: stretch;
  background: color-mix(in srgb, var(--panel) 96%, transparent);
  border-top: 1px solid var(--border);
  box-shadow: 0 -5px 20px rgba(15, 23, 42, .06);
}
.nav-spacer, .toggle-btn { display: none; }
.nav-item {
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 14px;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  transition: background .15s ease, color .15s ease;
}
.nav-item:hover { background: var(--panel-muted); }
.nav-item.active { background: var(--active); color: var(--text); }
.nav-icon { display: inline-flex; flex: 0 0 auto; color: var(--icon-color); }
.nav-item.active .nav-icon { color: var(--primary); }
.nav-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }

/* 3. Income dashboard and chart */
.income-top {
  display: grid;
  grid-template-columns: minmax(220px, .8fr) minmax(340px, 1.2fr);
  gap: clamp(18px, 3vw, 42px);
  align-items: center;
  min-height: 176px;
  margin-bottom: 24px;
  padding: 24px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}
.income-month-block { display: grid; gap: 10px; justify-items: start; }
.income-caption { color: var(--text-muted); font-size: 14px; }
.income-total-cloud-inner { display: contents; }
.income-total { font-size: clamp(30px, 4vw, 44px); font-weight: 700; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.month-switcher, .income-chart-year-switcher {
  display: inline-grid;
  grid-template-columns: 30px minmax(72px, auto) 30px;
  align-items: center;
  min-height: 34px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--panel-muted);
  box-shadow: var(--shadow-sm);
}
.month-switcher button, .income-chart-year-switcher button {
  width: 30px;
  height: 30px;
  padding: 0;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--text);
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
}
.month-switcher button:hover, .income-chart-year-switcher button:hover { background: var(--active); }
#monthSwitcherName, .income-chart-year-switcher span { min-width: 0; padding: 0 4px; text-align: center; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.income-month-chart { position: relative; min-width: 0; min-height: 140px; padding-top: 36px; }
.income-chart-wrap { height: 118px; }
#incomeChartSvg { display: block; width: 100%; height: 100%; overflow: visible; }
.income-chart-grid { stroke: var(--border); stroke-width: 1; vector-effect: non-scaling-stroke; }
.income-chart-bar { fill: color-mix(in srgb, var(--primary) 72%, white); cursor: pointer; transition: opacity .15s ease, transform .15s ease; }
.income-chart-bar:hover, .income-chart-bar:focus { fill: var(--primary); opacity: 1; }
.income-chart-bar.selected { fill: var(--success); }
.income-chart-year-bottom { position: absolute; top: 0; right: 0; left: 0; display: flex; justify-content: center; }
.income-chart-months { display: none; }

/* 4. Add-income form, calendar and category menu */
.income-form {
  position: relative;
  z-index: 20;
  margin-bottom: 24px;
  padding: 24px 24px 84px;
  overflow: visible;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}
.form-title { margin: 0 46px 18px 0; font-size: 18px; font-weight: 600; }
.form-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: end; }
.form-grid > label { min-width: 0; color: var(--text-muted); font-size: 13px; }
.form-grid input, .category-select {
  width: 100%;
  min-height: 42px;
  margin-top: 7px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--panel-muted);
  color: var(--text);
}
.form-grid input:focus, .category-select:focus { border-color: var(--primary); }
.date-field, .category-field { position: relative; margin-top: 7px; }
.date-field > input { margin-top: 0; padding-right: 46px; }
.calendar-btn {
  position: absolute;
  top: 1px;
  right: 1px;
  bottom: 1px;
  width: 42px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  border-left: 1px solid var(--border);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  background: transparent;
  color: var(--text);
  cursor: pointer;
}
.calendar-btn:hover { background: var(--active); }
.category-select { display: flex; align-items: center; justify-content: space-between; margin: 0; text-align: left; cursor: pointer; }
.category-arrow { display: inline-flex; transition: transform .15s ease; }
.category-select.open .category-arrow { transform: rotate(180deg); }
.calendar-popup, .category-popup {
  position: absolute;
  z-index: 1200;
  display: none;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
}
.calendar-popup.open, .category-popup.open { display: block; }
.calendar-popup { top: calc(100% + 8px); left: 0; width: min(320px, calc(100vw - 40px)); padding: 12px; }
.calendar-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.calendar-head > div { font-size: 14px; font-weight: 600; text-transform: capitalize; }
.calendar-nav { width: 30px; height: 30px; padding: 0; border: 0; border-radius: 8px; background: var(--panel-muted); color: var(--text); font-size: 22px; cursor: pointer; }
.calendar-nav:hover { background: var(--active); }
.calendar-weekdays, .calendar-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.calendar-weekdays span { padding: 3px 0; color: var(--text-muted); text-align: center; font-size: 10px; }
.calendar-day { width: 100%; height: 32px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--text); cursor: pointer; }
.calendar-day:hover { background: var(--active); }.calendar-day.other { opacity: .36; }.calendar-day.today { outline: 1px solid var(--primary); }.calendar-day.selected { background: var(--primary); color: #fff; }
.category-popup { top: calc(100% + 6px); left: 0; width: 100%; padding: 5px; }
.category-option { display: block; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--text); text-align: left; font-size: 13px; cursor: pointer; }
.category-option:hover, .category-option.selected { background: var(--active); }.category-option.selected { color: var(--primary); font-weight: 600; }
.save-btn {
  position: absolute;
  right: 24px;
  bottom: 20px;
  min-width: 102px;
  height: 42px;
  padding: 0 18px;
  border: 0;
  border-radius: var(--radius-sm);
  background: var(--primary);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 5px 12px color-mix(in srgb, var(--primary) 24%, transparent);
}
.save-btn:hover { filter: brightness(1.06); }
.form-actions { position: static; margin: 0; padding: 0; }
.cancel-btn {
  position: absolute;
  top: 18px;
  right: 18px;
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 1px solid color-mix(in srgb, var(--danger) 45%, var(--border));
  border-radius: 50%;
  background: transparent;
  color: var(--danger);
  cursor: pointer;
}
.cancel-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }
.cancel-btn:hover { background: color-mix(in srgb, var(--danger) 10%, transparent); }
.field-invalid input, .field-invalid .category-select { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239, 68, 68, .12); }
.field-invalid::after { display: block; margin-top: 4px; color: #ef4444; font-size: 11px; content: "Обязательное поле"; }
.add-income-btn {
  position: fixed;
  z-index: 1100;
  right: 24px;
  bottom: 84px;
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 9px 22px color-mix(in srgb, var(--primary) 38%, transparent);
  transition: transform .15s ease, filter .15s ease;
}
.add-income-btn svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; }.add-income-btn:hover { transform: translateY(-2px); filter: brightness(1.06); }

/* 5. History table, filters and actions */
#historySearchWrap { margin: 0 0 12px; }
#historySearch {
  width: 100%;
  height: 42px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--panel);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}
#historySearch::placeholder { color: var(--text-muted); }
.income-table-section.is-collapsed .income-list{display:none;}
.income-table-section-head{padding:10px 14px;border-bottom:1px solid var(--border);}
.income-table-section-title-wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.income-table-section-title{font-size:13px;font-weight:600;color:var(--text-muted);}
.income-table-collapse{width:30px;height:30px;padding:0;border:0;border-radius:8px;background:var(--panel-muted);color:var(--text);cursor:pointer;}
.income-table-collapse svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;transition:transform .15s ease;}
.income-table-section.is-collapsed .income-table-collapse svg{transform:rotate(-90deg);}
.income-table-section { position: relative; z-index: 1; overflow: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
.income-table-section-head { display: none; }
.income-list { --col-date: 110px; --col-amount: 132px; --col-category: 170px; --col-description: minmax(180px, 1fr); --col-actions: 76px; overflow: auto; max-height: calc(100vh - 190px); }
.income-row {
  position: relative;
  display: grid;
  grid-template-columns: var(--col-date) var(--col-amount) var(--col-category) var(--col-description) var(--col-actions);
  align-items: stretch;
  min-height: 54px;
  border-bottom: 1px solid var(--border);
}
.income-row:last-child { border-bottom: 0; }.income-row:not(.income-header):hover { background: var(--panel-muted); }
.income-row > div { display: flex; align-items: center; justify-content: center; min-width: 0; padding: 8px 10px; overflow: hidden; border-right: 1px solid var(--border); text-align: center; text-overflow: ellipsis; white-space: nowrap; }
.income-row > div:nth-child(4) { justify-content: flex-start; white-space: normal; overflow-wrap: anywhere; text-align: left; }.income-row > div:last-of-type { border-right: 0; }
.income-header { min-height: 42px; background: var(--panel-muted); color: var(--text-muted); font-size: 12px; font-weight: 600; }.income-header > div { padding: 0 10px; }
.income-amount { font-variant-numeric: tabular-nums; }
.income-empty { padding: 52px 20px; color: var(--text-muted); text-align: center; }
.header-filter-btn { padding: 0; border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; }.header-filter-btn:hover, .header-filter-btn.active { color: var(--primary); text-decoration: underline; text-underline-offset: 3px; }
.column-resizer { position: absolute; z-index: 3; top: 0; right: -7px; bottom: 0; width: 14px; cursor: col-resize; touch-action: none; }.column-resizer::after { position: absolute; top: 20%; left: 6px; width: 2px; height: 60%; border-radius: 1px; background: var(--primary); content: ""; opacity: 0; }.income-header > div:hover .column-resizer::after, .column-resizer.dragging::after { opacity: 1; }body.resizing { cursor: col-resize !important; user-select: none; }
.edit-income, .delete-income { position: absolute; top: 50%; display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--icon-color); box-shadow: var(--shadow-sm); cursor: pointer; opacity: 0; pointer-events: none; transform: translateY(-50%); transition: opacity .15s ease, transform .15s ease; }
.edit-income { right: 39px; }.delete-income { right: 7px; color: var(--danger); }.delete-income svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }.income-row:hover .edit-income, .income-row:hover .delete-income { opacity: 1; pointer-events: auto; }.edit-income:hover, .delete-income:hover { transform: translateY(-50%) scale(1.06); background: var(--panel-muted); }
.filter-popover { position: fixed; z-index: 1300; min-width: 160px; max-width: min(280px, calc(100vw - 16px)); padding: 6px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--panel); color: var(--text); box-shadow: var(--shadow-md); }.filter-choice { display: flex; justify-content: space-between; width: 100%; padding: 8px 10px; border: 0; border-radius: 7px; background: transparent; color: var(--text); text-align: left; font-size: 13px; cursor: pointer; }.filter-choice:hover, .filter-choice.selected { background: var(--active); }.filter-popover-actions { display: flex; gap: 6px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }.filter-popover-actions button { flex: 1; padding: 7px; border: 1px solid var(--border); border-radius: 7px; background: var(--panel-muted); color: var(--text); cursor: pointer; }.filter-popover-actions .apply { background: var(--primary); color: #fff; border-color: var(--primary); }

/* 6. Settings */
#settings.page.active { min-height: calc(100vh - 150px); display: grid; place-items: center; }
.settings-card { width: min(560px, 100%); padding: 24px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
.settings-title { margin-bottom: 14px; font-size: 16px; font-weight: 600; }.icon-color-title { margin-top: 26px; }
.theme-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }.theme-btn { min-height: 44px; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--panel-muted); color: var(--text); cursor: pointer; }.theme-btn:hover { background: var(--active); }.theme-btn.active { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.icon-colors { display: flex; flex-wrap: wrap; gap: 12px; }.icon-color, .custom-color { position: relative; width: 34px; height: 34px; padding: 0; overflow: hidden; border: 2px solid transparent; border-radius: 50%; background: var(--icon-color); cursor: pointer; }.icon-color.active { border-color: var(--text); box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px var(--icon-color); }.custom-color { display: grid; place-items: center; border-style: dashed; border-color: var(--border); background: var(--panel-muted); color: var(--text); }.custom-color input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }.custom-color span { pointer-events: none; font-size: 21px; }

/* 7. Glass themes */
html[data-theme="liquid-glass"] {
  --bg: #dce8f5;
  --bg-accent: #9abfe5;
  --panel: rgba(255, 255, 255, .54);
  --panel-muted: rgba(255, 255, 255, .38);
  --text: #172033;
  --text-muted: #53627a;
  --border: rgba(255, 255, 255, .62);
  --active: rgba(255, 255, 255, .62);
  --shadow-sm: 0 8px 24px rgba(49, 89, 130, .13);
  --shadow-md: 0 18px 40px rgba(49, 89, 130, .18);
}
html[data-theme="liquid-glass-dark"] {
  --bg: #101925;
  --bg-accent: #263d58;
  --panel: rgba(22, 35, 51, .68);
  --panel-muted: rgba(41, 59, 81, .64);
  --text: #edf5ff;
  --text-muted: #b2c5d8;
  --border: rgba(183, 215, 245, .20);
  --active: rgba(92, 132, 175, .33);
  --shadow-sm: 0 8px 24px rgba(0, 0, 0, .26);
  --shadow-md: 0 18px 40px rgba(0, 0, 0, .34);
}
html[data-theme^="liquid-glass"] body { background: radial-gradient(circle at 12% 4%, var(--bg-accent), transparent 34%), radial-gradient(circle at 88% 14%, color-mix(in srgb, var(--primary) 22%, transparent), transparent 30%), var(--bg); }
html[data-theme^="liquid-glass"] header, html[data-theme^="liquid-glass"] .sidebar, html[data-theme^="liquid-glass"] .income-top, html[data-theme^="liquid-glass"] .income-form, html[data-theme^="liquid-glass"] .income-table-section, html[data-theme^="liquid-glass"] .settings-card, html[data-theme^="liquid-glass"] #historySearch, html[data-theme^="liquid-glass"] .calendar-popup, html[data-theme^="liquid-glass"] .category-popup, html[data-theme^="liquid-glass"] .filter-popover { -webkit-backdrop-filter: blur(20px) saturate(125%); backdrop-filter: blur(20px) saturate(125%); }

/* 8. Responsive behavior */
@media (max-width: 820px) {
  .income-top { grid-template-columns: 1fr; gap: 20px; }.income-month-chart { min-height: 156px; }.form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }.income-list { --col-date: 92px; --col-amount: 118px; --col-category: 150px; --col-actions: 70px; }
}
@media (max-width: 560px) {
  header { height: 58px; } header h1 { font-size: 18px; } main { padding: 16px; }.content { padding-bottom: 76px; }.sidebar { height: 62px; }.nav-item { padding: 7px 6px; gap: 5px; }.nav-label { font-size: 11px; }.income-top { min-height: 0; padding: 18px; border-radius: var(--radius-md); }.income-total { font-size: 34px; }.income-chart-wrap { height: 108px; }.income-form { padding: 20px 18px 82px; border-radius: var(--radius-md); }.form-grid { grid-template-columns: 1fr; gap: 12px; }.save-btn { right: 18px; bottom: 18px; }.cancel-btn { top: 14px; right: 14px; }.add-income-btn { right: 16px; bottom: 74px; width: 46px; height: 46px; }.income-list { --col-date: 1fr; --col-amount: 1fr; --col-category: 1fr; --col-description: 1fr; --col-actions: 1fr; max-height: none; }.income-header { display: none; }.income-row { grid-template-columns: 1fr 1fr; min-height: 0; padding: 10px 44px 10px 10px; gap: 0; }.income-row > div { justify-content: flex-start; min-height: 30px; padding: 5px 8px; border-right: 0; text-align: left; }.income-row > div:nth-child(1), .income-row > div:nth-child(3) { color: var(--text-muted); font-size: 12px; }.income-row > div:nth-child(4) { grid-column: 1 / -1; }.edit-income, .delete-income { opacity: 1; pointer-events: auto; }.edit-income { top: 27px; right: 38px; }.delete-income { top: 27px; right: 7px; }.settings-card { padding: 20px; border-radius: var(--radius-md); }.theme-options { grid-template-columns: 1fr; }
}
@media (hover: none) { .income-row .edit-income, .income-row .delete-income { opacity: 1; pointer-events: auto; } }

/* Enhancements */
.income-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px;width:100%;}
.income-stat{padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:var(--panel-muted);min-width:0;}
.income-stat-label{display:block;color:var(--text-muted);font-size:11px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.income-stat-value{display:block;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.income-stat-change{font-size:11px;color:var(--success);margin-top:2px;}
.history-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;}
.history-filter{height:42px;min-width:145px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--panel);color:var(--text);}

  if(!section||!btn)return;
  if(localStorage.getItem('incomeTableCollapsed')==='1')section.classList.add('is-collapsed');
  const sync=()=>{const c=section.classList.contains('is-collapsed');btn.title=c?'Развернуть таблицу':'Свернуть таблицу';btn.setAttribute('aria-label',btn.title)};
  btn.addEventListener('click',()=>{section.classList.toggle('is-collapsed');localStorage.setItem('incomeTableCollapsed',section.classList.contains('is-collapsed')?'1':'0');sync()});sync();
}

function renderAll(){updateStats();drawChart();renderHistory()}
updateDescriptions();renderAll();
})();
</script>
</body>
</html>
