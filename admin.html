<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>qPokoy — Админ-панель</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:#0d1117;color:#f4f7fb;min-height:100vh}
    a{color:inherit}
    .wrap{width:min(920px,calc(100% - 28px));margin:0 auto;padding:28px 0 48px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
    .brand{font-weight:800;font-size:22px;letter-spacing:.2px}
    .back{color:#a9b4c2;text-decoration:none}
    .card{background:#151b23;border:1px solid #2b3440;border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 10px 36px rgba(0,0,0,.18)}
    h1,h2{margin:0 0 14px}
    h1{font-size:25px}
    h2{font-size:19px}
    .muted{color:#9ca8b7}
    .notice{padding:12px 14px;border-radius:12px;background:#202833;margin-top:12px}
    .error{background:#3a1e23;color:#ffd8dc}
    .ok{background:#153425;color:#d7ffe5}
    .row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
    label{display:flex;flex-direction:column;gap:7px;font-size:13px;color:#b7c1ce;flex:1;min-width:180px}
    input{width:100%;border:1px solid #394655;background:#0f141b;color:#f6f8fb;border-radius:12px;padding:12px 13px;font-size:15px;outline:none}
    input:focus{border-color:#70849d}
    button{border:0;border-radius:12px;padding:11px 14px;background:#eef3f8;color:#111820;font-weight:700;font-size:14px;cursor:pointer}
    button.secondary{background:#263140;color:#edf3fa}
    button.danger{background:#4a2328;color:#ffe5e8}
    button:disabled{opacity:.5;cursor:not-allowed}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
    .kv{display:grid;grid-template-columns:minmax(150px,210px) 1fr;gap:8px 14px;font-size:14px}
    .kv div:nth-child(odd){color:#9da9b8}
    code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
    [hidden]{display:none!important}
    @media(max-width:680px){
      .kv{grid-template-columns:1fr;gap:3px}
      .kv div:nth-child(even){margin-bottom:9px}
      .top{align-items:flex-start}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <div class="brand">qPokoy</div>
      <a class="back" href="/">← На сайт</a>
    </div>

    <section class="card">
      <h1>Админ-панель</h1>
      <div id="bootStatus" class="muted">Проверяю доступ…</div>
      <div id="selfInfo" class="notice" hidden></div>
    </section>

    <section id="adminPanel" class="card" hidden>
      <h2>Управление доступом пользователя</h2>
      <form id="searchForm" class="row" autocomplete="off">
        <label>
          Email пользователя
          <input id="emailInput" type="email" required maxlength="254" placeholder="user@example.com">
        </label>
        <button type="submit">Найти</button>
      </form>
      <div id="message" class="notice" hidden></div>

      <div id="userCard" hidden>
        <div class="card">
          <h2>Пользователь</h2>
          <div id="userData" class="kv"></div>
        </div>

        <div class="card">
          <h2>Ручной доступ</h2>
          <div class="actions">
            <button type="button" data-action="grant_month">+ 1 месяц</button>
            <button type="button" data-action="grant_year">+ 1 год</button>
            <button type="button" data-action="grant_lifetime">Бессрочно</button>
            <button type="button" class="danger" data-action="clear_manual">Сбросить ручной доступ</button>
          </div>

          <div class="row" style="margin-top:14px">
            <label>
              Доступ до даты включительно
              <input id="customUntil" type="date">
            </label>
            <button type="button" class="secondary" id="setCustomUntil">Установить дату</button>
          </div>
          <p class="muted" style="margin:14px 0 0">Все изменения проверяются сервером и записываются в журнал.</p>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/api-client.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
