<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>qPokoy — Управление</title>
<link rel="stylesheet" href="css/admin.css?v=dev-2026.10.03.177">
<script defer src="js/api-client.js?v=dev-2026.10.03.168"></script>
<script defer src="js/admin.js?v=dev-2026.10.03.177"></script>
</head>
<body class="qp-admin">
<main>
<section class="admin-access-shell" aria-labelledby="adminTitle">
<h1 id="adminTitle">Управление</h1>
<a href="index.html">Главная / вход</a>
<p id="adminMessage" role="status" aria-live="polite">Проверяем доступ…</p>
</section>
<section id="adminControls" hidden>
<form id="adminSearch">
<div class="search-line">
<input id="adminEmail" type="email" maxlength="254" required autocomplete="off" aria-label="Email пользователя">
<button class="search-button" type="submit" aria-label="Найти пользователя" title="Найти пользователя">
<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
</button>
</div>
</form>
<article id="adminUser" hidden>
<dl id="adminDetails" class="admin-details"></dl>
<section class="access-panel" aria-labelledby="grantAccessTitle">
<h2 id="grantAccessTitle">Доступ</h2>
<div class="date-line">
<div class="admin-date-picker">
<input id="adminUntil" type="text" readonly inputmode="none" placeholder="дд.мм.гггг" aria-label="Дата окончания доступа" aria-haspopup="dialog" aria-expanded="false">
<button type="button" class="admin-date-clear" id="adminDateClear" aria-label="Очистить дату" title="Очистить дату" hidden>×</button>
<div class="admin-calendar-popup" id="adminCalendarPopup" role="dialog" aria-label="Выбор даты">
<div class="admin-calendar-head">
<button type="button" class="admin-calendar-nav" id="adminCalendarPrev" aria-label="Предыдущий месяц">‹</button>
<div class="admin-calendar-heading">
<span id="adminCalendarMonth"></span>
<button type="button" class="admin-calendar-year-button" id="adminCalendarYearButton" aria-label="Выбрать год"></button>
</div>
<button type="button" class="admin-calendar-nav" id="adminCalendarNext" aria-label="Следующий месяц">›</button>
</div>
<div class="admin-calendar-weekdays" id="adminCalendarWeekdays"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
<div class="admin-calendar-days" id="adminCalendarDays"></div>
<div class="admin-calendar-years" id="adminCalendarYears" hidden></div>
</div>
</div>
</div>
<div class="actions" aria-label="Срок доступа"><button type="button" data-choice="month">Месяц</button><button type="button" data-choice="year">Год</button><button type="button" data-choice="lifetime">Бессрочный</button></div>
<div class="renew"><label><input id="adminAutoRenew" type="checkbox"> Автопродление на месяц / год</label></div>
<div class="final-actions">
<button type="button" id="adminSaveAccess" class="save-access">Сохранить</button>
<button type="button" id="adminResetAccess" class="danger">Сбросить</button>
</div>
<p id="adminSaveMessage" class="admin-save-message" role="status" aria-live="polite" hidden></p>
</section>
</article>
</section>
</main>
</body>
</html>
