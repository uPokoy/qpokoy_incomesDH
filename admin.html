<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>qPokoy — Управление</title>
<link rel="stylesheet" href="css/appearance.css?v=dev-2026.10.03.181">
<link rel="stylesheet" href="css/admin.css?v=dev-2026.10.03.178">
<link rel="stylesheet" href="css/admin-platform.css?v=dev-2026.10.03.181">
<script defer src="js/api-client.js?v=dev-2026.10.03.185"></script>
<script defer src="js/admin.js?v=dev-2026.10.03.177"></script>
</head>
<body class="qp-admin qp-bg-standard">
<main>
<section class="admin-access-shell" aria-labelledby="adminTitle">
<h1 id="adminTitle">Управление</h1>
<a href="index.html">Главная / вход</a>
<p id="adminMessage" role="status" aria-live="polite">Проверяем доступ…</p>
</section>
<section id="adminControls" hidden>
<section class="access-panel" aria-labelledby="testPaymentTitle">
<h2 id="testPaymentTitle">Тест ЮKassa</h2>
<div class="final-actions">
<button type="button" id="adminTestPayment" class="save-access">Тестовая оплата 149 ₽</button>
<button type="button" id="adminTestPaymentAutoRenew" class="save-access">149 ₽ + автопродление</button>
</div>
<p id="adminTestPaymentMessage" class="admin-save-message" role="status" aria-live="polite" hidden></p>
</section>
<form id="adminSearch">
<div class="search-line">
<input id="adminEmail" type="email" maxlength="254" required autocomplete="off" aria-label="Email пользователя">
<button class="search-button" type="submit" aria-label="Найти пользователя" title="Найти пользователя">
<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
</button>
</div>
</form>
<article id="adminUser" hidden>
<dl id="adminDetails" class="admin-details"></dl>
<section class="access-panel" aria-labelledby="grantAccessTitle">
<h2 id="grantAccessTitle">Доступ</h2>
<div class="date-line">
<div class="admin-date-picker">
<input id="adminUntil" type="text" readonly inputmode="none" placeholder="дд.мм.гггг" aria-label="Дата окончания доступа" aria-haspopup="dialog" aria-expanded="false">
<button type="button" class="admin-date-clear" id="adminDateClear" aria-label="Очистить дату" title="Очистить дату" hidden>×</button>
<div class="admin-calendar-popup" id="adminCalendarPopup" role="dialog" aria-label="Выбор даты">
<div class="admin-calendar-head">
<button type="button" class="admin-calendar-nav" id="adminCalendarPrev" aria-label="Предыдущий месяц">‹</button>
<div class="admin-calendar-heading">
<span id="adminCalendarMonth"></span>
<button type="button" class="admin-calendar-year-button" id="adminCalendarYearButton" aria-label="Выбрать год"></button>
</div>
<button type="button" class="admin-calendar-nav" id="adminCalendarNext" aria-label="Следующий месяц">›</button>
</div>
<div class="admin-calendar-weekdays" id="adminCalendarWeekdays"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
<div class="admin-calendar-days" id="adminCalendarDays"></div>
<div class="admin-calendar-years" id="adminCalendarYears" hidden></div>
</div>
</div>
</div>
<div class="actions" aria-label="Срок доступа"><button type="button" data-choice="month">Месяц</button><button type="button" data-choice="year">Год</button><button type="button" data-choice="lifetime">Бессрочный</button></div>
<div class="renew"><label><input id="adminAutoRenew" type="checkbox"> Автопродление на месяц / год</label></div>
<div class="final-actions">
<button type="button" id="adminSaveAccess" class="save-access">Сохранить</button>
<button type="button" id="adminResetAccess" class="danger">Сбросить</button>
</div>
<p id="adminSaveMessage" class="admin-save-message" role="status" aria-live="polite" hidden></p>
</section>
</article>
</section>
</main>
<script>
window.addEventListener('DOMContentLoaded',()=>{
  const plainButton=document.getElementById('adminTestPayment');
  const autoButton=document.getElementById('adminTestPaymentAutoRenew');
  const status=document.getElementById('adminTestPaymentMessage');
  if(!plainButton||!autoButton||!status)return;
  const startPayment=async(button,autoRenew)=>{
    if(button.disabled)return;
    plainButton.disabled=true;
    autoButton.disabled=true;
    status.hidden=true;
    status.textContent='';
    try{
      const key=autoRenew?'qPokoyAdminTestPaymentAutoRenewRequestIdV1':'qPokoyAdminTestPaymentRequestIdV1';
      let requestId='';
      try{requestId=sessionStorage.getItem(key)||'';}catch(_){}
      if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(requestId)){
        requestId=crypto.randomUUID();
        try{sessionStorage.setItem(key,requestId);}catch(_){}
      }
      const payment=await window.qPokoyApi.createPayment('monthly',autoRenew,requestId);
      const confirmation=new URL(payment?.confirmation_url||'');
      const trusted=['yoomoney.ru','yookassa.ru'].some(host=>confirmation.hostname===host||confirmation.hostname.endsWith('.'+host));
      if(confirmation.protocol!=='https:'||!trusted)throw new Error('ЮKassa не вернула корректную ссылку на оплату.');
      try{sessionStorage.removeItem(key);}catch(_){}
      location.assign(confirmation.toString());
    }catch(error){
      status.textContent=error?.message||'Не удалось создать тестовый платёж.';
      status.dataset.error='true';
      status.hidden=false;
      plainButton.disabled=false;
      autoButton.disabled=false;
    }
  };
  plainButton.addEventListener('click',()=>startPayment(plainButton,false));
  autoButton.addEventListener('click',()=>startPayment(autoButton,true));
});
</script>
</body>
</html>
