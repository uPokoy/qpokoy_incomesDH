<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>qPokoy — Управление</title>
<link rel="stylesheet" href="css/admin.css?v=dev-2026.10.03.171">
<script defer src="js/api-client.js?v=dev-2026.10.03.168"></script>
<script defer src="js/admin.js?v=dev-2026.10.03.171"></script>
</head>
<body class="qp-admin">
<main>
<section class="admin-access-shell" aria-labelledby="adminTitle">
<h1 id="adminTitle">Управление</h1>
<a href="index.html">Главная / вход</a>
<p id="adminMessage" role="status" aria-live="polite">Проверяем доступ…</p>
</section>
<section id="adminControls" hidden>
<form id="adminSearch">
<label for="adminEmail">Email пользователя</label>
<div class="search-line">
<input id="adminEmail" type="email" maxlength="254" required autocomplete="off">
<button class="search-button" type="submit" aria-label="Найти пользователя" title="Найти пользователя">
<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
</button>
</div>
</form>
<article id="adminUser" hidden>
<dl id="adminDetails" class="admin-details"></dl>
<div class="actions"><button type="button" data-action="month">Доступ на месяц</button><button type="button" data-action="year">Доступ на год</button><button type="button" data-action="lifetime">Бессрочный доступ</button></div>
<label for="adminUntil">Доступ до выбранной даты (по Москве). После окончания — ещё 3 дня доступа.</label>
<div class="search-line"><input id="adminUntil" type="date"><button type="button" data-action="until">Установить дату</button></div>
<div class="renew"><label><input id="adminAutoRenew" type="checkbox"> Автопродление подписки на месяц / год</label><button type="button" id="adminSaveRenew">Сохранить</button></div>
<button type="button" data-action="reset" class="danger">Сбросить ручное назначение</button>
</article>
</section>
</main>
</body>
</html>
